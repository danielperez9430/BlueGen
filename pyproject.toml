[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    "E501",   # line too long (handled by formatter)
    "W505",   # line too long (docstring)
    "F841",   # local variable assigned but never used (common in pipeline scripts)
    "E722",   # bare except (some scripts use it for resilience)
]

[tool.ruff.lint.per-file-ignores]
"prs_research_pipeline/scripts/stages/*.sh" = []
"prs_research_pipeline/scripts/sss/*.py" = ["F841"]
"prs_research_pipeline/scripts/benchmarking/*.py" = ["F841"]
