[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bluegen"
description = "Personal genomics platform: WGS VCF → polygenic risk scores, ClinVar, PharmGKB, ancestry — fully offline"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
# version comes from utils.constants.PIPELINE_VERSION (single source of truth,
# IMPROVEMENT_PLAN.md TIER 0.1); dependencies from requirements.txt.
dynamic = ["version", "dependencies"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.optional-dependencies]
# The Streamlit dashboard is optional: `pip install -e ".[dashboard]"`.
dashboard = ["streamlit>=1.50", "plotly>=5.18"]   # >=1.50 for width="stretch"

[project.urls]
Homepage = "https://github.com/danielperez9430/BlueGen"
Changelog = "https://github.com/danielperez9430/BlueGen/blob/main/CHANGELOG.md"

[project.scripts]
# `bluegen run --vcf x.vcf.gz` == `python prs.py run --vcf x.vcf.gz`.
# Only an *editable* install is supported (pip install -e .): prs.py locates
# prs_research_pipeline/ relative to its own file and refuses to start
# otherwise — see the guard at the top of prs.py.
bluegen = "prs:main"

[tool.setuptools]
py-modules = ["prs"]
packages = ["bluegen"]

[tool.setuptools.package-dir]
bluegen = "prs_research_pipeline/bluegen"

[tool.setuptools.dynamic]
version = { attr = "prs_research_pipeline.scripts.utils.constants.PIPELINE_VERSION" }
dependencies = { file = ["prs_research_pipeline/requirements.txt"] }

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    "E501",   # line too long (handled by formatter)
    "W505",   # line too long (docstring)
    "E402",   # module-level import not at top — venv bootstrap in prs.py
    "E701",   # multiple statements on one line (colon) — pipeline style
    "E702",   # multiple statements on one line (semicolon) — compact status lines
    "E731",   # lambda assignment — intentional translation helper
    "E741",   # ambiguous variable name — intentional single-char in math contexts
    "F401",   # imported but unused — common in pipeline scripts
    "F402",   # import shadowed by loop var — harmless in older scripts
    "F541",   # f-string without placeholders — cosmetic
    "F841",   # local variable assigned but never used — common in pipeline scripts
    # E722 (bare except) and F821 (undefined name) are deliberately NOT ignored
    # since 2.1.0: F821 hid a NameError in 06_prs_compute.py and three missing
    # imports. Use an explicit `# noqa: E722  # <reason>` where a bare except
    # is intentional.
]

[tool.ruff.lint.per-file-ignores]
"prs_research_pipeline/scripts/stages/*.sh" = []
"prs_research_pipeline/scripts/sss/*.py" = ["F841"]
"prs_research_pipeline/scripts/benchmarking/*.py" = ["F841"]
